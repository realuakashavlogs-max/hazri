<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#2563EB" />
    <title>Offline • Hazri Book</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.25rem;
        background: #f8fafc;
        color: #0f172a;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      .card {
        max-width: 26rem;
        width: 100%;
        background: #ffffff;
        border: 1px solid #e2e8f0;
        border-radius: 1.5rem;
        padding: 1.75rem;
        text-align: center;
        box-shadow: 0 10px 25px -10px rgba(15, 23, 42, 0.12);
      }
      h1 {
        margin: 0 0 0.5rem;
        font-size: 1.25rem;
      }
      p {
        margin: 0 0 1.25rem;
        font-size: 0.9375rem;
        color: #475569;
        line-height: 1.5;
      }
      button {
        min-height: 44px;
        padding: 0.625rem 1.25rem;
        border: none;
        border-radius: 0.75rem;
        background: #2563eb;
        color: #ffffff;
        font-size: 0.9375rem;
        font-weight: 700;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>You are offline</h1>
      <p>
        Hazri Book needs an active internet connection to sign in and sync attendance or Sabaq records with Supabase.
      </p>
      <button type="button" onclick="window.location.reload()">Try Again</button>
    </main>
  </body>
</html>
