name: Build and deploy Hazri Book

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check and build production app
        run: npm run build

      - name: Save production build for Cloudflare deployment
        uses: actions/upload-artifact@v4
        with:
          name: hazri-dist
          path: dist/
          if-no-files-found: error
          retention-days: 3

      - name: Deploy to Cloudflare Workers
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ env.CLOUDFLARE_API_TOKEN }}
          accountId: 3b36b2acf6fe41fe8854cb48200a437d
          command: deploy --config wrangler.jsonc

      - name: Explain skipped deployment
        if: ${{ env.CLOUDFLARE_API_TOKEN == '' }}
        run: echo "Build passed. Cloudflare deployment was skipped because CLOUDFLARE_API_TOKEN is not configured in GitHub repository secrets."
